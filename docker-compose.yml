# I-003 (ADR-0009, TAKTYL-4): stos Taktyla w Docker Compose. Wymagane: Docker + Compose v2, git.
#   cp .env.example .env   (wpisz sekrety lokalnie albo: make env)
#   docker compose up --build                      sklep, backpanel, API, baza, proxy
#   make dev                                       hot reload (profil dev)
#   docker compose --profile test run --rm test    testy w kontenerze
# Konfiguracja wylacznie z .env (poza repo). Port bazy NIE jest wystawiony na host.
name: taktyl

x-env-file: &env-file
  - path: .env
    required: false

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: api

# Adres bazy sklada sie z POSTGRES_* (jedno haslo w .env, bez rozjazdu z DATABASE_URL).
x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-taktyl}:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (make env)}@db:5432/${POSTGRES_DB:-taktyl}?schema=public

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

# Wspolne dla uslug profilu dev: caly monorepo montowany z hosta, node_modules w wolumenach.
x-dev: &dev
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.workspace
  image: taktyl-workspace:local
  env_file: *env-file
  working_dir: /app
  profiles: [dev]
  restart: "no"
  volumes:
    - .:/app
    - nm-root:/app/node_modules
    - nm-api:/app/apps/api/node_modules
    - nm-web:/app/apps/web/node_modules
    - nm-admin:/app/apps/admin/node_modules
    - nm-contracts:/app/packages/contracts/node_modules
    - nm-domain:/app/packages/domain/node_modules
    - nm-tokens:/app/packages/tokens/node_modules
    - nm-ui:/app/packages/ui/node_modules
    - media:/data/media

services:
  # ------------------------------------------------------------------ domyslny stos (produkcyjny tryb lokalny)
  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taktyl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (make env)}
      POSTGRES_DB: ${POSTGRES_DB:-taktyl}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: *pg-health

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: taktyl-migrate:local
    env_file: *env-file
    environment: *db-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  seed:
    build: *api-build
    image: taktyl-api:local
    command: ["node", "dist/seed.js"]
    env_file: *env-file
    environment: *db-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    build: *api-build
    image: taktyl-api:local
    restart: unless-stopped
    env_file: *env-file
    environment: *db-env
    volumes:
      - media:/data/media
    depends_on:
      seed: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://taktyl.localhost}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api.taktyl.localhost}
        PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://admin.taktyl.localhost}
        PUBLIC_GTM_ID: ${PUBLIC_GTM_ID:-}
    image: taktyl-web:local
    restart: unless-stopped
    env_file: *env-file
    environment:
      PORT: "3000"
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://taktyl.localhost}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api.taktyl.localhost}
        PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://admin.taktyl.localhost}
    image: taktyl-admin:local
    restart: unless-stopped
    env_file: *env-file
    environment:
      PORT: "3001"
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Caddy slucha wewnatrz na 8080 i dziala jako nie-root; host mapuje PROXY_HTTP_PORT (domyslnie 80).
    user: "65532:65532"
    cap_drop: [ALL]
    # binarny Caddy ma setcap cap_net_bind_service; bez tej zdolnosci exec konczy sie "operation not permitted"
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    ports:
      - "${PROXY_HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
      api: { condition: service_healthy }

  # ------------------------------------------------------------------ profil dev (hot reload, kod z hosta)
  # Start: make dev (= docker compose --profile dev up db migrate seed api-dev web-dev admin-dev proxy-dev).
  # Lista uslug jest jawna, bo uslugi domyslne (api, web, admin, proxy) tez wstaja z profilem dev.
  api-dev:
    <<: *dev
    environment:
      <<: *db-env
      NODE_ENV: development
    command:
      - sh
      - -c
      - pnpm turbo run build --filter='@taktyl/api^...' && pnpm --filter @taktyl/api db:generate && pnpm --filter @taktyl/api dev
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  web-dev:
    <<: *dev
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://api-dev:4000
    command:
      - sh
      - -c
      - pnpm turbo run build --filter='@taktyl/web^...' && pnpm --filter @taktyl/web dev
    depends_on:
      api-dev: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s

  admin-dev:
    <<: *dev
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://api-dev:4000
    command:
      - sh
      - -c
      - pnpm turbo run build --filter='@taktyl/admin^...' && pnpm --filter @taktyl/admin dev
    depends_on:
      api-dev: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s

  proxy-dev:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [dev]
    restart: "no"
    user: "65532:65532"
    cap_drop: [ALL]
    # binarny Caddy ma setcap cap_net_bind_service; bez tej zdolnosci exec konczy sie "operation not permitted"
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    environment:
      WEB_UPSTREAM: web-dev:3000
      ADMIN_UPSTREAM: admin-dev:3001
      API_UPSTREAM: api-dev:4000
    ports:
      - "${PROXY_HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    depends_on:
      web-dev: { condition: service_healthy }
      admin-dev: { condition: service_healthy }
      api-dev: { condition: service_healthy }

  # ------------------------------------------------------------------ profil test
  # Baza testowa to osobny kontener w pamieci (tmpfs): test integracyjny CZYSCI baze (docs/decyzje API-003),
  # wiec nigdy nie moze trafic w baze robocza.
  db-test:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: [test]
    restart: "no"
    environment:
      POSTGRES_USER: taktyl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (make env)}
      POSTGRES_DB: taktyl_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck: *pg-health

  # Vitest (domain, contracts, ui, api z baza testowa). Miejsce na Playwright + axe + Lighthouse:
  # dojda jako kolejne kroki infra/docker/run-tests.sh i obraz z przegladarkami (docs/12).
  test:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workspace
    image: taktyl-workspace:local
    profiles: [test]
    restart: "no"
    env_file: *env-file
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://taktyl:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (make env)}@db-test:5432/taktyl_test?schema=public
      TEST_DATABASE_URL: postgresql://taktyl:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env (make env)}@db-test:5432/taktyl_test?schema=public
    working_dir: /app
    command: ["sh", "infra/docker/run-tests.sh"]
    depends_on:
      db-test: { condition: service_healthy }

  # ------------------------------------------------------------------ profil e2e
  # I-010 (TAKTYL-44, docs/12 par. 1): Playwright przeciw pelnemu stosowi (proxy -> web, admin, api).
  #   docker compose up -d --build --wait && docker compose --profile e2e run --rm e2e      (albo: make e2e)
  # `e2e-reset` przywraca dane demo (db:reset-demo) przed KAZDYM przebiegiem; DEMO_MODE=true tylko w tym kontenerze jednorazowym.
  # Raport HTML i slady trafiaja do e2e/playwright-report i e2e/test-results (poza repo, .gitignore).
  e2e-reset:
    build: *api-build
    image: taktyl-api:local
    profiles: [e2e]
    restart: "no"
    env_file: *env-file
    environment:
      <<: *db-env
      DEMO_MODE: "true"
    command: ["node", "dist/seed.js", "--reset"]
    depends_on:
      api: { condition: service_healthy }

  e2e:
    build:
      context: ./e2e
    image: taktyl-e2e:local
    profiles: [e2e]
    restart: "no"
    # Chromium w kontenerze potrzebuje wspolnej pamieci IPC (zalecenie Playwrighta) i init (sprzatanie procesow).
    ipc: host
    init: true
    environment:
      # Chromium mapuje taktyl.localhost, admin.taktyl.localhost i api.taktyl.localhost na te usluge (playwright.config.ts).
      E2E_PROXY: proxy:8080
      E2E_WORKERS: ${E2E_WORKERS:-3}
      E2E_RETRIES: ${E2E_RETRIES:-1}
      # TAKTYL-54 (S25-S36): konto owner z .env stosu (nigdy w repo) i sekret webhooka (S30); konta editor/viewer tworzy setup z owner.
      E2E_ADMIN_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      E2E_ADMIN_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      E2E_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      - ./e2e/playwright-report:/work/playwright-report
      - ./e2e/test-results:/work/test-results
    depends_on:
      proxy: { condition: service_healthy }
      e2e-reset: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ profil perf
  # I-012 (TAKTYL-83, docs/12 par. 4, S36): Lighthouse (LCP, CLS, TBT, waga i liczba zadan pierwszego widoku) na stosie produkcyjnym.
  #   docker compose up -d --build --wait && docker compose --profile perf run --rm --build perf      (albo: make perf)
  # Stos nie jest resetowany (pomiar nic nie zapisuje). Wyniki: perf/reports (poza repo, .gitignore).
  perf:
    build:
      context: ./perf
    image: taktyl-perf:local
    profiles: [perf]
    restart: "no"
    ipc: host
    init: true
    environment:
      PERF_PROXY: proxy:8080
      PERF_RUNS: ${PERF_RUNS:-3}
      PERF_ENFORCE: ${PERF_ENFORCE:-1}
      PERF_INFO_METRICS: ${PERF_INFO_METRICS:-}
    volumes:
      - ./perf/reports:/work/reports
    depends_on:
      proxy: { condition: service_healthy }

  # ------------------------------------------------------------------ profil demo
  # I-009 (B-014, TAKTYL-65): cykliczny reset danych demo, tylko gdy DEMO_MODE=true (inaczej usluga konczy sie bledem).
  # Odstep: DEMO_RESET_INTERVAL_MINUTES (domyslnie 60); DEMO_RESET_INTERVAL_SECONDS (jesli ustawione) ma pierwszenstwo, do testow.
  # Pierwszy reset po pierwszym odstepie, nie przy starcie. Reset to jedna transakcja (TRUNCATE + seed + audit + outbox):
  # konta i sesje backpanelu zostaja, a znaczniki rewalidacji w outboxie odswiezaja sklep (worker w api).
  reset-demo:
    build: *api-build
    image: taktyl-api:local
    profiles: [demo]
    restart: unless-stopped
    env_file: *env-file
    environment: *db-env
    entrypoint: ["sh", "-c"]
    # obraz api ma HEALTHCHECK na porcie 4000; ta usluga nie nasluchuje, wiec zdrowie = zyje petla (sleep albo trwajacy reset)
    healthcheck:
      test: ["CMD-SHELL", "pidof sleep >/dev/null || pidof node >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    command:
      - |
        if [ "$${DEMO_MODE:-false}" != "true" ]; then echo "reset-demo: DEMO_MODE nie jest true, koncze"; exit 1; fi
        interval="$${DEMO_RESET_INTERVAL_SECONDS:-$$(( $${DEMO_RESET_INTERVAL_MINUTES:-60} * 60 ))}"
        echo "reset-demo: reset co $${interval} s"
        while true; do
          sleep "$$interval"
          node dist/seed.js --reset || echo "reset-demo: blad resetu, kolejna proba w nastepnym cyklu"
        done
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  media:
  caddy-data:
  caddy-config:
  nm-root:
  nm-api:
  nm-web:
  nm-admin:
  nm-contracts:
  nm-domain:
  nm-tokens:
  nm-ui:
