packages:
  - "apps/*"
  - "packages/*"

# I-008 (TAKTYL-75): pnpm 12 domyslnie nie uruchamia skryptow instalacji. Jawna lista zaleznosci, ktorym ufamy:
# Prisma (pobranie/generacja silnika) i esbuild (binarka platformowa). Reszta ma skrypty zablokowane.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - "@next/env@16.4.0"
  - "@next/swc-darwin-arm64@16.4.0"
  - "@next/swc-darwin-x64@16.4.0"
  - "@next/swc-linux-arm64-gnu@16.4.0"
  - "@next/swc-linux-arm64-musl@16.4.0"
  - "@next/swc-linux-x64-gnu@16.4.0"
  - "@next/swc-linux-x64-musl@16.4.0"
  - "@next/swc-win32-arm64-msvc@16.4.0"
  - "@next/swc-win32-x64-msvc@16.4.0"
  - next@16.4.0
  - lucide-react@1.54.0

# I-008 faza 2b: CLI Prisma 7.10 ciagnie deepmerge-ts 7.x i mysql2 (high, tylko devDependency, adapter MySQL nieuzywany).
# Wymuszamy wersje naprawione; sprawdzone: prisma generate i migrate deploy dzialaja (ADR-0010).
overrides:
  deepmerge-ts: ">=8.0.2"
  mysql2: ">=3.22.0"
  # ADM-006: opcjonalny peer effect z @hookform/resolvers rozwiazywal sie do 3.21.0 (blokowane przez minimumReleaseAge), czego
  # nie zna wpis w lockfile po turbo prune; przypinamy wersje juz uzywana przez Prisma.
  effect: "3.20.0"
