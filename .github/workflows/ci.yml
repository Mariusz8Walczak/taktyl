# I-006 (ADR-0008, ADR-0009, docs/19 par. 5, TAKTYL-7, TAKTYL-8): CI Taktyla.
# Wszystko w kontenerach, tak samo jak lokalnie (docker compose). Tylko GITHUB_TOKEN, uprawnienia minimalne.
# Jobs: lint, typecheck, unit, build-images, e2e-docker, audyt-tokenow, kontrola-sciezek, gitleaks, audit-deps.
# a11y i perf-budget (docs/19 par. 5) dojda razem z Playwright i Lighthouse (docs/12), gdy powstana scenariusze.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_IMAGE: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: ESLint (turbo)
        run: docker compose --profile test run --rm --no-deps test pnpm turbo run lint
      # Prettier na calym repo nie przechodzi (pliki innych zadan, docs/decyzje.md I-006): krok informacyjny
      # do czasu jednorazowego sformatowania repozytorium, potem zdejmij continue-on-error.
      - name: Prettier (informacyjnie)
        continue-on-error: true
        run: docker compose --profile test run --rm --no-deps test pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: TypeScript strict (turbo)
        run: docker compose --profile test run --rm --no-deps test pnpm turbo run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Vitest w kontenerze test (baza testowa w tmpfs)
        run: docker compose --profile test run --rm test
      - name: Logi bazy testowej przy bledzie
        if: failure()
        run: docker compose --profile test logs --tail=100 db-test

  audyt-tokenow:
    name: audyt-tokenow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Audyt tokenow (pnpm audit:tokens)
        run: docker compose --profile test run --rm --no-deps test pnpm audit:tokens

  build-images:
    name: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, target: api }
          - { app: api, target: migrate }
          - { app: web, target: runner }
          - { app: admin, target: runner }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Obraz ${{ matrix.app }} (${{ matrix.target }}), bez publikacji
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=img-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=img-${{ matrix.app }}-${{ matrix.target }}

  e2e-docker:
    name: e2e-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .env z losowymi sekretami jednorazowymi
        run: sh scripts/init-env.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start stosu z budowa obrazow (db -> migrate -> seed -> api -> web, admin -> proxy)
        run: docker compose up -d --build --wait
      - name: Test dymny stosu (noindex na kazdym hoscie, /health, 18 produktow)
        run: sh scripts/smoke-stack.sh
      # TODO(TAKTYL-27+): Playwright S1-S25, axe, Lighthouse jako kolejne kroki (docs/12), na tym samym stosie.
      - name: Logi stosu przy bledzie
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
      - name: Zatrzymanie stosu
        if: always()
        run: docker compose down -v

  kontrola-sciezek:
    name: kontrola-sciezek
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test negatywny kontroli (--self-test)
        run: sh scripts/check-forbidden-paths.sh --self-test
      - name: Kontrola sciezek zakazanych
        run: sh scripts/check-forbidden-paths.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skan sekretow w calej historii (kontener gitleaks, bez licencji i tokenow)
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --verbose

  audit-deps:
    name: audit-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # I-008 (TAKTYL-75): blokuje critical we WSZYSTKICH zaleznosciach (prod + dev; po aktualizacji
      # Vitest 5 czysto). Zostaje do fazy 2: high w produkcji (postcss w Next 15, deepmerge-ts w Prisma 6),
      # po migracji Next 16 / Prisma 7 zmienic na --audit-level=high bez continue-on-error (docs/adr/0010).
      - name: pnpm audit (wszystkie zaleznosci, critical) - blokuje
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --audit-level=critical'
      - name: pnpm audit (produkcyjne, critical) - blokuje
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --prod --audit-level=critical'
      # Informacyjnie (bez blokady, TODO faza 2): high w produkcji i w calym drzewie.
      # Decyzja i lista: docs/decyzje.md I-006, docs/adr/0010.
      - name: pnpm audit (produkcyjne, high) - informacyjnie
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --prod --audit-level=high'
      - name: pnpm audit (wszystkie zaleznosci, high) - informacyjnie
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --audit-level=high'
