# I-006 (ADR-0008, ADR-0009, docs/19 par. 5, TAKTYL-7, TAKTYL-8): CI Taktyla.
# Wszystko w kontenerach, tak samo jak lokalnie (docker compose). Tylko GITHUB_TOKEN, uprawnienia minimalne.
# Jobs: lint, typecheck, unit, build-images, e2e-docker, perf, e2e-demo, actionlint, audyt-tokenow, kontrola-sciezek, gitleaks, audit-deps.
# perf (I-012, TAKTYL-83): Lighthouse wg docs/12 par. 4; LCP informacyjnie, reszta budzetu blokuje job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# I-009 (TAKTYL-65): anulowanie tylko dla PR (nowy push do PR zastepuje stary bieg). Push na main i reczne uruchomienia maja
# osobna grupe na commit (sha), wiec KAZDY push na main dostaje pelny bieg, a szybkie pushe nie anuluja sie nawzajem.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_IMAGE: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: ESLint (turbo)
        run: docker compose --profile test run --rm --no-deps test pnpm turbo run lint
      # Prettier na calym repo nie przechodzi (pliki innych zadan, docs/decyzje.md I-006): krok informacyjny
      # do czasu jednorazowego sformatowania repozytorium, potem zdejmij continue-on-error.
      - name: Prettier (informacyjnie)
        continue-on-error: true
        run: docker compose --profile test run --rm --no-deps test pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: TypeScript strict (turbo)
        run: docker compose --profile test run --rm --no-deps test pnpm turbo run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Vitest w kontenerze test (baza testowa w tmpfs)
        run: docker compose --profile test run --rm test
      - name: Logi bazy testowej przy bledzie
        if: failure()
        run: docker compose --profile test logs --tail=100 db-test

  audyt-tokenow:
    name: audyt-tokenow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Audyt tokenow (pnpm audit:tokens)
        run: docker compose --profile test run --rm --no-deps test pnpm audit:tokens
      - name: Audyt ruchu (pnpm audit:motion, docs/07 §1)
        run: docker compose --profile test run --rm --no-deps test pnpm audit:motion

  build-images:
    name: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, target: api }
          - { app: api, target: migrate }
          - { app: web, target: runner }
          - { app: admin, target: runner }
          # I-014: serwery MCP (jeden Dockerfile, argument APP)
          - { app: mcp-front, target: runtime, file: infra/docker/Dockerfile.mcp }
          - { app: mcp-admin, target: runtime, file: infra/docker/Dockerfile.mcp }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Obraz ${{ matrix.app }} (${{ matrix.target }}), bez publikacji
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file || format('apps/{0}/Dockerfile', matrix.app) }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.file && format('APP={0}', matrix.app) || '' }}
          push: false
          cache-from: type=gha,scope=img-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=img-${{ matrix.app }}-${{ matrix.target }}

  e2e-docker:
    name: e2e-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .env z losowymi sekretami jednorazowymi
        run: sh scripts/init-env.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start stosu z budowa obrazow (db -> migrate -> seed -> api -> web, admin -> proxy)
        run: docker compose up -d --build --wait
      - name: Test dymny stosu (noindex na kazdym hoscie, /health, 18 produktow)
        run: sh scripts/smoke-stack.sh
      # I-010 (TAKTYL-44): Playwright S1-S24 w kontenerze e2e na tym samym stosie. Usluga e2e-reset przywraca dane demo
      # (db:reset-demo) przed przebiegiem; raport HTML i slady bledow trafiaja do artefaktow. axe, Lighthouse: kolejne kroki (docs/12).
      - name: TypeScript testow e2e (strict)
        run: docker compose --profile e2e run --rm --build --no-deps e2e pnpm run typecheck
      - name: Playwright S1-S24 (kontener e2e, start od reset demo)
        run: docker compose --profile e2e run --rm --build e2e
      # I-011 (S30, TAKTYL-71): tu, nie w e2e-demo (petla reset-demo czyscilaby outbox w trakcie). Na koncu przywraca dane demo.
      - name: "Test S30 (wylacz sklep, zmien cene, wlacz sklep; outbox dostarcza po powrocie)"
        run: sh scripts/smoke-outbox.sh
      - name: Raport Playwright (HTML) jako artefakt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-raport
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Slady i zrzuty bledow Playwright jako artefakt
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-slady
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Logi stosu przy bledzie
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
      - name: Zatrzymanie stosu
        if: always()
        run: docker compose --profile e2e down -v

  # I-012 (S36, docs/12 par. 4, TAKTYL-83): Lighthouse (tryb Komorka, mediana z 3) na stosie produkcyjnym: waga i liczba zadan
  # pierwszego widoku, LCP, CLS, TBT (zastepnik INP), obce domeny. Waga, zadania, CLS, TBT i obce domeny blokuja job;
  # LCP jest INFORMACYJNY (PERF_INFO_METRICS=lcp_ms). TAKTYL-84: po poprawkach (baner zgod z serwera, mniej JS i plikow,
  # jeden arkusz ukladu) karta i koszyk spadly o 0,5-1 s, ale content (limit 2000 ms) nadal wynosi 2,1-2,7 s, a wynik
  # jest skwantowany co ok. 150 ms i skacze miedzy przebiegami, wiec nie jest stabilny z marginesem (docs/23, S36).
  # Zdejmij PERF_INFO_METRICS dopiero po zmianie zakresu (rozmiar fontu, framework, HTTP/2 w pomiarze).
  # Job nie blokuje PR (nie jest w wymaganych), dopoki nie ma kilku zielonych przebiegow z rzedu.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .env z losowymi sekretami jednorazowymi
        run: sh scripts/init-env.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start stosu z budowa obrazow
        run: docker compose up -d --build --wait
      - name: Lighthouse (kontener perf)
        env:
          PERF_INFO_METRICS: lcp_ms
        run: docker compose --profile perf run --rm --build perf
      - name: Wyniki Lighthouse jako artefakt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: perf/reports
          retention-days: 14
          if-no-files-found: ignore
      - name: Logi stosu przy bledzie
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
      - name: Zatrzymanie stosu
        if: always()
        run: docker compose --profile perf down -v

  # I-009 (B-014, S31, S32, TAKTYL-65): tryb demo na pelnym stosie z profilem demo. Czas od "up" do gotowosci stosu jest
  # mierzony i wypisany (S31: <= 10 min). Petla reset-demo ma odstep 60 s, wiec test czeka na samoczynny reset.
  e2e-demo:
    name: e2e-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .env z losowymi sekretami jednorazowymi, tryb demo
        run: |
          sh scripts/init-env.sh
          sed -i 's/^DEMO_MODE=.*/DEMO_MODE=true/' .env
          echo 'DEMO_RESET_INTERVAL_SECONDS=60' >> .env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start stosu z profilem demo (czas do gotowosci, S31)
        run: |
          start=$(date +%s)
          docker compose --profile demo up -d --build --wait
          echo "S31: stos gotowy po $(( $(date +%s) - start )) s (limit 600 s)"
          test $(( $(date +%s) - start )) -le 600
      - name: Test dymny stosu
        run: sh scripts/smoke-stack.sh
      - name: "Test dymny trybu demo (S32 - reset przywraca seed, petla reset-demo)"
        run: sh scripts/smoke-demo.sh --cycle
      - name: Logi stosu przy bledzie
        if: failure()
        run: docker compose --profile demo ps -a && docker compose --profile demo logs --tail=200
      - name: Zatrzymanie stosu
        if: always()
        run: docker compose --profile demo down -v

  # I-009 (TAKTYL-65): lint workflowow w kontenerze (bez instalacji na runnerze), obraz przypiety digestem.
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  kontrola-sciezek:
    name: kontrola-sciezek
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test negatywny kontroli (--self-test)
        run: sh scripts/check-forbidden-paths.sh --self-test
      - name: Kontrola sciezek zakazanych
        run: sh scripts/check-forbidden-paths.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skan sekretow w calej historii (kontener gitleaks, bez licencji i tokenow)
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --verbose
      # I-007: test negatywny konfiguracji - allowlista kluczy magazynu przegladarki ma pozostac waska.
      - name: Test negatywny konfiguracji gitleaks
        run: sh scripts/test-gitleaks-config.sh

  audit-deps:
    name: audit-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # I-008 (TAKTYL-75, ADR-0010): po fazach 2a i 2b blokuje high i critical we WSZYSTKICH zaleznosciach
      # (prod + dev). Nowa luka high w dowolnej zaleznosci zatrzymuje CI; naprawa przez aktualizacje albo
      # jawny wpis w `overrides` (pnpm-workspace.yaml) z uzasadnieniem w ADR-0010. Moderate i low nie blokuja.
      - name: pnpm audit (wszystkie zaleznosci, high+critical) - blokuje
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --audit-level=high'
      - name: pnpm audit (produkcyjne, high+critical) - blokuje
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$NODE_IMAGE" sh -c \
            'corepack enable && pnpm audit --prod --audit-level=high'
