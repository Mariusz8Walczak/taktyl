# I-006 (ADR-0009, TAKTYL-7): wspolny krok jobow CI w kontenerze - .env z losowymi sekretami jednorazowymi
# oraz obraz narzedziowy workspace zbudowany z cache buildx (gha) i zaladowany jako taktyl-workspace:local.
# Zadnych sekretow repozytorium: wartosci generuje scripts/init-env.sh na biezacym runnerze.
name: Przygotuj kontener narzedziowy
description: .env z losowymi sekretami i obraz workspace z cache gha
runs:
  using: composite
  steps:
    - name: .env z losowymi sekretami jednorazowymi
      shell: sh
      run: sh scripts/init-env.sh
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Obraz workspace (cache gha)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: infra/docker/Dockerfile.workspace
        load: true
        tags: taktyl-workspace:local
        cache-from: type=gha,scope=workspace
        cache-to: type=gha,mode=max,scope=workspace
