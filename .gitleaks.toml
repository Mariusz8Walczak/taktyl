# I-007 (ADR-0008, docs/19, TAKTYL-8): konfiguracja gitleaks. Reguly domyslne + waskie allowlisty.
title = "Taktyl"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholdery CHANGE_ME i plik przykladowy (bez prawdziwych sekretow)"
paths = [
  '''^\.env\.example$''',
]
regexes = [
  '''CHANGE_ME''',
]

# Falszywe trafienia reguly generic-api-key: pola "key" w manifescie zdjec (klucze obrazow, nie sekrety)
# i stale testowe w testach API (np. udawane hasla). Wylacznie ta jedna regula i tylko te pliki.
[[allowlists]]
description = "Klucze obrazow w manifescie zdjec i stale testowe (nie sa sekretami)"
targetRules = ["generic-api-key"]
paths = [
  '''^assets/manifest\.json$''',
  '''^docs/09-grafika-i-zdjecia\.md$''',
  '''^apps/api/(src|test)/.*\.test\.ts$''',
]

# I-007: klucze localStorage/sessionStorage ("taktyl.<nazwa>.v<N>", np. taktyl.cart.v1) to nazwy, nie sekrety.
# Jedna allowlista zamiast wpisu na kazda nowa nazwe. Waski warunek (AND): regula generic-api-key, CALY sekret ma
# ksztalt klucza magazynu przegladarki, a plik lezy w kodzie sklepu/panelu/pakietow albo w ich testach.
# Nie dotyczy innych regul ani innych sciezek (np. scripts/). Test negatywny: scripts/test-gitleaks-config.sh.
[[allowlists]]
description = "Klucze magazynu przegladarki taktyl.<nazwa>.v<N> w kodzie aplikacji i testach"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^taktyl\.[a-z][a-z0-9.-]*\.v[0-9]+$''',
]
paths = [
  '''^apps/web/src/''',
  '''^apps/admin/src/''',
  '''^packages/[^/]+/src/''',
  '''^apps/(web|admin)/test/''',
  '''^packages/[^/]+/test/''',
]

# I-008 (TAKTYL-63): klucz obrazu "k-kwarc-60_grafit_top" w testach manifestu zdjec to identyfikator, nie sekret.
# Dwa pliki testowe, jedna regula, jedna wartosc (pokrywa tez commit 180f8f6 w historii).
[[allowlists]]
description = "Klucz obrazu w tescie media-dashboard (nie sekret)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^packages/contracts/test/media-dashboard\.test\.ts$''',
  '''^apps/admin/test/media-pulpit-dziennik\.test\.tsx$''',
]
regexes = [
  '''k-kwarc-60_grafit_top''',
]
